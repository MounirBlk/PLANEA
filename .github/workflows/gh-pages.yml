name: Gh-Pages

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/flutter-gh-pages@v9
        with:
          customArgs: >
            --dart-define="NAKAMA_HOST=${{ secrets.NAKAMA_HOST }}"
            --dart-define="NAKAMA_SERVER_KEY=${{ secrets.NAKAMA_SERVER_KEY }}"
            --dart-define="NAKAMA_GRPC_PORT=${{ secrets.NAKAMA_GRPC_PORT }}"
            --dart-define="NAKAMA_HTTP_PORT=${{ secrets.NAKAMA_HTTP_PORT }}"